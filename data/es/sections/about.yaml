summary: |
  Soy **Agustin Nicolas Gonzalez**, **Ingeniero en Informática** egresado de la Universidad de Buenos Aires. Construí una base técnica sólida a través de proyectos universitarios, desarrollo personal y experiencia en distintos ámbitos profesionales.

  Busco seguir creciendo en el área de IT. Mi formación académica y mi experiencia previa en otros rubros me aportaron compromiso, responsabilidad y la capacidad de cumplir objetivos con plazos exigentes.

  Actualmente me desempeño como **desarrollador backend** en SAP, participando en el desarrollo de soluciones empresariales y en proyectos sobre la plataforma **OneStream**.


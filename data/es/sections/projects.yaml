projects:
  - name: CI Pipeline — Estandarización para Inscopix y CAIMAN
    logo: fas fa-flask
    role: Coautor — Tesis de grado
    timeline: "2024 - 2025"
    repo: https://github.com/CGK-Laboratory/ci_pipe
    url: https://www.preprints.org/manuscript/202601.2405
    summary: |
      Desarrollamos un pipeline de estandarización de datos para las tecnologías de laboratorio **Inscopix** y **CAIMAN** del CGK Laboratory (Estados Unidos), orientado a unificar y reproducir flujos de análisis en neurociencia computacional.

      El trabajo culminó con un **preprint oficial aprobado** y publicado en Preprints.org, disponible como publicación abierta para la comunidad científica.

      - [Repositorio en GitHub](https://github.com/CGK-Laboratory/ci_pipe)
      - [Preprint aprobado en Preprints.org](https://www.preprints.org/manuscript/202601.2405)
    tags: ["tesis"]

  - name: Kiosquito — ERP para pequeños comercios
    logo: fas fa-store
    role: Desarrollador y autor — Producto comercial
    timeline: "2024 - Presente"
    summary: |
      **Kiosquito** es un **ERP** liviano para kioscos, almacenes, verdulerías, carnicerías y pequeños comercios.
      Lo desarrollé y comercializo en MercadoLibre: el cliente recibe instalador y licencia; solo requiere internet en el primer inicio para validarla, luego funciona **100% offline**.

      **Módulos:** Inventario · Ventas · Proveedores · Estadísticas · Facturación PDF · Análisis por fecha.
    gallery:
      - /images/projects/kioskito/1.png
      - /images/projects/kioskito/2.png
      - /images/projects/kioskito/3.png
      - /images/projects/kioskito/4.png
      - /images/projects/kioskito/5.png
      - /images/projects/kioskito/6.png
    tags: ["kioskito"]


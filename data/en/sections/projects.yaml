projects:
  - name: CI Pipeline — Standardization for Inscopix & CAIMAN
    logo: fas fa-flask
    role: Co-author — Undergraduate thesis
    timeline: "2024 - 2025"
    repo: https://github.com/CGK-Laboratory/ci_pipe
    url: https://www.preprints.org/manuscript/202601.2405
    summary: |
      We developed a data standardization pipeline for **Inscopix** and **CAIMAN** laboratory technologies from CGK Laboratory (United States), aimed at unifying and reproducing analysis workflows in computational neuroscience.

      The work culminated in an **official approved preprint** published on Preprints.org, openly available to the scientific community.

      - [GitHub repository](https://github.com/CGK-Laboratory/ci_pipe)
      - [Approved preprint on Preprints.org](https://www.preprints.org/manuscript/202601.2405)
    tags: ["tesis"]

  - name: Kiosquito — ERP for small businesses
    logo: fas fa-store
    role: Developer & author — Commercial product
    timeline: "2024 - Present"
    summary: |
      **Kiosquito** is a lightweight **ERP** for kiosks, grocery stores, butcher shops and small retailers.
      I developed and sell it on MercadoLibre: customers receive an installer and license key; internet is only required on first launch, then it runs **fully offline**.

      **Modules:** Inventory · Sales · Suppliers · Analytics · PDF invoicing · Date analysis.
    gallery:
      - /images/projects/kioskito/1.png
      - /images/projects/kioskito/2.png
      - /images/projects/kioskito/3.png
      - /images/projects/kioskito/4.png
      - /images/projects/kioskito/5.png
      - /images/projects/kioskito/6.png
    tags: ["kioskito"]

